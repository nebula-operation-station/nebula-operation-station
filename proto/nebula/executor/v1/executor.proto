message RunAttachedRequest {
  AuthorizeRunRequest run = 1;
  // Endpoints to try in order (from the inventory); the pin decides
  // whether a host is the right one.
  repeated string endpoints = 2;
  // 0 means 60 s; at most 600 s.
  uint32 timeout_seconds = 3;
}

message RunAttachedResponse {
  // success, script_failed, script_interrupted, execution_timeout,
  // result_missing, precheck_failed, or a connection class:
  // network_unreachable, authentication_failed, host_key_mismatch.
  string class = 1;
  string detail = 2;
  int32 exit_code = 3;
  // Untrusted host output: one JSON document of at most 1 MiB (empty
  // unless class is success or the script failed after printing it).
  bytes result = 4;
  // Untrusted host output: stderr, at most 10 MiB plus a marker.
  bytes log = 5;
  bool log_truncated = 6;
  string endpoint = 7;
  int64 duration_ms = 8;
  // The run never reached the host (network_unreachable: no endpoint got
  // as far as the host key), so the permit's host is unused again and the
  // same run may be retried before the permit expires.
  bool retryable = 9;
}

message StartDurableRequest {
  AuthorizeRunRequest run = 1;
  repeated string endpoints = 2;
  // 0 means 3600 s; at most 21600 s (6 h).
  uint32 timeout_seconds = 3;
}

message StartDurableResponse {
  RunStatus run = 1;
}

message GetRunResponse {
  RunStatus run = 1;
}

message GetRunRequest {
  string execution_id = 1;
  string host_id = 2;
  bool release = 3;
}

message RunStatus {
  string execution_id = 1;
  string host_id = 2;
  // dispatching, running or finished.
  string state = 3;
  // Set when finished: a spec 07 class, plus not_executed (nothing ran)
  // and unknown (the outcome cannot be known; never re-run).
  string class = 4;
  string detail = 5;
  int32 exit_code = 6;
  // Untrusted host output, as in RunAttachedResponse.
  bytes result = 7;
  bytes log = 8;
  bool log_truncated = 9;
  string endpoint = 10;
  int64 dispatched_at_unix = 11;
  int64 finished_at_unix = 12;
  bool released = 13;
}

message ProposeScheduleGrantRequest {
