syntax = "proto3";

package nebula.executor.v1;

option go_package = "github.com/nebula-operation-station/nebula-operation-station/internal/rpc/executorv1;executorv1";

// ExecutorService is served by nebula-executor on a Unix domain socket only.
// Every method is authorized by the caller's kernel-reported UID
// (SO_PEERCRED); see internal/peercred for the method-to-role table.
//
// Compatibility rules: fields are never renumbered or reused; removed fields
// are reserved. New methods require an explicit entry in the role table,
// otherwise they are denied for everyone.
service ExecutorService {
  // Role: server, admin.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // Role: server. Submits a fully resolved execution request. The executor
  // canonicalizes it (RFC 8785), computes the digest itself and returns the
  // approval challenge. For LOW risk inside an active privileged session the
  // permit is issued immediately.
  rpc ProposeExecution(ProposeExecutionRequest) returns (ProposeExecutionResponse);

  // Role: server. Relays a WebAuthn assertion over the challenge returned by
  // ProposeExecution. The executor verifies it on its own.
  rpc SubmitAssertion(SubmitAssertionRequest) returns (SubmitAssertionResponse);

  // Role: server. Starts and completes the privileged web session, which
  // requires a user-verified assertion.
  rpc BeginPrivilegedSession(BeginPrivilegedSessionRequest) returns (BeginPrivilegedSessionResponse);
  rpc CompletePrivilegedSession(CompletePrivilegedSessionRequest) returns (CompletePrivilegedSessionResponse);

  // Role: server. Asks whether one host run is covered by an issued permit
  // and, if so, reserves the host (one use per host). The executor hashes
  // the artifact and parameters itself. Refused (stage_plan_invalid) for a
  // permit proposed with a stage plan: nothing would record the host's
  // outcome, so its stage could never pass or be skipped.
  rpc AuthorizeRun(AuthorizeRunRequest) returns (AuthorizeRunResponse);

  // Role: server. Authorizes one host run exactly like AuthorizeRun and
  // runs it attached on the pinned host (spec 07, Milestone 4): the
  // executor connects with the pin's credential (which must be the run's),
  // sends the parameters it holds from the proposal and the artifact, and
  // returns the bounded result and log. The permit's host is used once the
  // run is authorized, whatever the outcome.
  rpc RunAttached(RunAttachedRequest) returns (RunAttachedResponse);

  // Role: server. Authorizes one host run like RunAttached and starts it
  // as a durable job (spec 07): recorded in executor.db before anything
  // is sent, dispatched once, then only observed. The executor reconciles
  // open runs in the background (also after a restart, once unlocked) and
  // never dispatches a run again.
  rpc StartDurable(StartDurableRequest) returns (StartDurableResponse);

  // Role: server. The state of a durable run; with release, a finished
  // run's result and log are dropped from executor.db after this answer.
  rpc GetRun(GetRunRequest) returns (GetRunResponse);

  // Role: admin. Decrypts the SSH keys into the in-process keyring and,
  // once initialized, the vault's master key (spec 06: one passphrase is
  // tried on both; the scope retries one of them alone).
  rpc Unlock(UnlockRequest) returns (UnlockResponse);

  // Role: server, admin. Wipes the keyring and the vault key and ends the
  // privileged session.
  // Locking is always permitted because it only reduces capability.
  rpc Lock(LockRequest) returns (LockResponse);

  // Role: admin. Lists pending permits with the executor's own view of them,
  // so that `nebula approve` never relies on what the web UI displayed.
  rpc ListPending(ListPendingRequest) returns (ListPendingResponse);

  // Role: admin. Hardened approval path.
  rpc ApproveCLI(ApproveCLIRequest) returns (ApproveCLIResponse);

  // Executor-held risk data (H01). ProposeExecution rejects a risk_class
  // below the minimum the executor derives from it: the declared risk of a
  // trusted (artifact, action, version), HIGH for anything untrusted, and
  // for actions above LOW the criticality of every target (HIGH for hosts
  // without a matching record; LOW actions need MEDIUM on CRITICAL or
  // unrecorded hosts). AuthorizeRun re-checks it for each host. Only the
  // admin role may read or change it; the server cannot.

  // Role: admin. Trusts an artifact for one action and version at a
  // declared risk. The executor hashes the bytes itself. Replaces an
  // earlier entry for the same artifact, action and version.
  rpc TrustArtifact(TrustArtifactRequest) returns (TrustArtifactResponse);

  // Role: admin. Withdraws trust; the artifact is HIGH again.
  rpc UntrustArtifact(UntrustArtifactRequest) returns (UntrustArtifactResponse);

  // Role: admin.
  rpc ListTrustedArtifacts(ListTrustedArtifactsRequest) returns (ListTrustedArtifactsResponse);

  // Role: admin. Sets the executor's criticality of a host, bound to its
  // pinned key fingerprint, or removes the record (clear). A target counts
  // as recorded only if host ID and fingerprint both match.
  rpc SetHostCriticality(SetHostCriticalityRequest) returns (SetHostCriticalityResponse);

  // Role: admin.
  rpc ListHostCriticality(ListHostCriticalityRequest) returns (ListHostCriticalityResponse);

  // WebAuthn registration (H03). Every registration starts with a one-time
  // code that an admin created on the executor host. Once a credential is
  // registered, further ones must also be confirmed by a user-verified
  // assertion of a registered credential. The executor verifies the
  // attestation itself and keeps the public key.

  // Role: admin. Creates a single-use code for the next registration
  // (15 minutes); replaces an unused earlier code.
  rpc CreateRegistrationCode(CreateRegistrationCodeRequest) returns (CreateRegistrationCodeResponse);

  // Role: server. Starts a registration and returns the WebAuthn options.
  rpc BeginRegistration(BeginRegistrationRequest) returns (BeginRegistrationResponse);

  // Role: server. Completes a registration. Single use: the registration is
  // consumed whether or not it succeeds.
  rpc FinishRegistration(FinishRegistrationRequest) returns (FinishRegistrationResponse);

  // Role: admin.
  rpc ListWebAuthnCredentials(ListWebAuthnCredentialsRequest) returns (ListWebAuthnCredentialsResponse);

  // Role: admin. Removes a credential and locks the executor (ends the
  // privileged session, revokes every permit, cancels pending
  // registrations and the outstanding code).
  rpc RemoveWebAuthnCredential(RemoveWebAuthnCredentialRequest) returns (RemoveWebAuthnCredentialResponse);

  // Web login (M2). The server relays; the executor verifies the
  // user-verified assertion against the registered credentials. A login
  // grants nothing on the executor.

  // Role: server. Starts a login (single-use challenge, 2 minutes).
  rpc BeginLogin(BeginLoginRequest) returns (BeginLoginResponse);

  // Role: server. Completes a login; the login is consumed whether or not
  // it succeeds.
  rpc FinishLogin(FinishLoginRequest) returns (FinishLoginResponse);

  // Role: server. Reports whether a credential is still registered, so the
  // server can end web sessions opened with a credential that was removed.
  rpc CheckCredential(CheckCredentialRequest) returns (CheckCredentialResponse);

  // TOTP recovery (M2, spec 05). Recovery opens only a reading web session;
  // privileged work stays blocked until a new WebAuthn credential is
  // registered.

  // Role: admin. Creates a new, not yet active TOTP secret (replaces an
  // earlier one) and returns it for the authenticator app.
  rpc BeginTOTPSetup(BeginTOTPSetupRequest) returns (BeginTOTPSetupResponse);

  // Role: admin. Activates the new secret with one current code from the app.
  rpc ConfirmTOTPSetup(ConfirmTOTPSetupRequest) returns (ConfirmTOTPSetupResponse);

  // Role: admin.
  rpc RemoveTOTP(RemoveTOTPRequest) returns (RemoveTOTPResponse);

  // Role: admin.
  rpc GetTOTPStatus(GetTOTPStatusRequest) returns (GetTOTPStatusResponse);

  // Role: server. Verifies a recovery code (single use, rate limited). On
  // success the executor ends the privileged session, revokes permits and
  // enters the recovery state.
  rpc RecoveryLogin(RecoveryLoginRequest) returns (RecoveryLoginResponse);

  // Role: admin. Ends a pending recovery after the admin confirmed, on the
  // executor host, that the given credential (registered after the
  // recovery login) is their own new key.
  rpc FinishRecovery(FinishRecoveryRequest) returns (FinishRecoveryResponse);

  // SSH host keys (H05). The executor pins one key per host; every endpoint
  // of the host must present it. Pins are made on the executor host after
  // the admin confirmed the fingerprint (or imported known_hosts), never by
  // the server.

  // Role: admin. Reads the host key of one endpoint without sending a user
  // name or credential.
  rpc ProbeHostKey(ProbeHostKeyRequest) returns (ProbeHostKeyResponse);

  // Role: admin. Pins a host key and binds the host to one SSH user and one
  // credential reference. A host that is already pinned must be unpinned
  // first.
  rpc PinHostKey(PinHostKeyRequest) returns (PinHostKeyResponse);

  // Role: admin. Removes a pin (and a mismatch block with it); the host
  // cannot be connected until it is pinned again.
  rpc UnpinHostKey(UnpinHostKeyRequest) returns (UnpinHostKeyResponse);

  // Role: server, admin. Lists the pins; public data only.
  rpc ListHostKeys(ListHostKeysRequest) returns (ListHostKeysResponse);

  // Role: server. Proposes re-pinning a host blocked by a host key
  // mismatch to the key it presented (spec 08: a HIGH action with user
  // verification). The executor builds the request from its own block
  // record (host, pinned and presented fingerprint, endpoint, block time);
  // the caller names only the host. Approve it like any permit
  // (SubmitAssertion or `nebula approve`), then call CommitRepin.
  rpc ProposeRepin(ProposeRepinRequest) returns (ProposeRepinResponse);

  // Role: server. Carries out an approved re-pin: the block must still be
  // the approved one, and the endpoint must still present the approved
  // key, which then replaces the pin (with the host's criticality record).
  rpc CommitRepin(CommitRepinRequest) returns (CommitRepinResponse);

  // Role: server. Bulk enrollment (spec 08): reads the host keys of new
  // hosts and proposes pinning them, as one HIGH action with user
  // verification. The executor probes the endpoints itself; the approval
  // binds host, endpoint, fingerprint, SSH user and credential of every
  // host. Hosts pinned this way get no criticality record (they count as
  // HIGH until an admin sets one on the executor host).
  rpc ProposeEnroll(ProposeEnrollRequest) returns (ProposeEnrollResponse);

  // Role: server. Pins the hosts of an approved enrollment whose endpoint
  // still presents the approved key, and tries a login when the keys are
  // unlocked.
  rpc CommitEnroll(CommitEnrollRequest) returns (CommitEnrollResponse);

  // Role: admin. Returns the public half of a loaded SSH key (the keyring
  // must be unlocked), for the enrollment script.
  rpc GetSSHPublicKey(GetSSHPublicKeyRequest) returns (GetSSHPublicKeyResponse);

  // Role: admin. Connects to a pinned host with its credential (the keyring
  // must be unlocked) over the given endpoints, in order, and disconnects.
  // A host key mismatch blocks the host.
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse);

  // Vault (spec 06): secrets that are not SSH keys. No RPC returns a
  // secret value; the executor decrypts them only for its own runs.
  // Role: admin. Creates the vault under a passphrase (at least 32
  // characters) and leaves it unlocked.
  rpc InitVault(InitVaultRequest) returns (InitVaultResponse);
  // Role: admin. Stores a secret as a new version (vault unlocked).
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  // Role: admin. Lists secret IDs and versions, never values.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  // Role: admin. Deletes a secret (vault unlocked).
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);

  // Stage engine (spec 07, Milestone 6). A permit proposed with a stage
  // plan runs stage by stage: the executor refuses a host whose stage is
  // not open, stops the rollout when a stage has more failed hosts than
  // its plan allows, and opens a later stage only through a gate (or by
  // itself, for a LOW or MEDIUM plan that says auto). The outcomes it
  // decides on are its own run records.
  //
  // Role: server. Checks a gate (open the next stage, skip a host) and
  // returns what it needs: nothing beyond the privileged session for LOW
  // and MEDIUM, a fresh user-verified assertion over a challenge bound to
  // digest and gate for HIGH and CRITICAL, the CLI in hardened mode.
  rpc BeginGate(BeginGateRequest) returns (BeginGateResponse);

  // Role: server. Applies a gate with the privileged session and, for HIGH
  // and CRITICAL, the assertion over BeginGate's challenge (single use).
  rpc CommitGate(CommitGateRequest) returns (CommitGateResponse);

  // Role: server. Stops a rollout: no further host is authorized. Needs no
  // approval, since it only takes permission away.
  rpc AbortRollout(AbortRolloutRequest) returns (AbortRolloutResponse);

  // Role: server, admin. The executor's view of a rollout.
  rpc GetRollout(GetRolloutRequest) returns (GetRolloutResponse);

  // Role: admin. Hardened gate path (`nebula approve --stage`, `--skip`).
  rpc ApproveGateCLI(ApproveGateCLIRequest) returns (ApproveGateCLIResponse);

  // Trust an artifact from the browser (M7-4). Role: server. The executor
  // hashes the bytes and binds a fresh user-verified assertion to (hash,
  // action, version, risk); needs the privileged session; hardened mode
  // refuses (cli_required) and keeps `nebula artifact trust`.
  rpc BeginTrustArtifact(BeginTrustArtifactRequest) returns (BeginTrustArtifactResponse);
  rpc CommitTrustArtifact(CommitTrustArtifactRequest) returns (CommitTrustArtifactResponse);
  // Role: server, admin. Whether the executor trusts these bytes as this
  // action and version, and at which risk.
  rpc GetArtifactTrust(GetArtifactTrustRequest) returns (GetArtifactTrustResponse);

  // Signed modules (M7-5). Role: server. The executor verifies the lock's
  // SSH signature (namespace nebula-module) by a trusted signer, checks
  // each script against the lock, builds each action's artifact itself and
  // trusts it at the action's risk. Refused when the module was signed by
  // another signer before (signer_changed) or the version's lock changed.
  rpc RegisterModule(RegisterModuleRequest) returns (RegisterModuleResponse);
  // Role: admin (`nebula signer …`). Adding a signer is CRITICAL: the CLI
  // asks for the fingerprint to be typed.
  rpc AddSigner(AddSignerRequest) returns (AddSignerResponse);
  rpc RemoveSigner(RemoveSignerRequest) returns (RemoveSignerResponse);
  rpc ConfirmModuleSigner(ConfirmModuleSignerRequest) returns (ConfirmModuleSignerResponse);
  // Role: server, admin.
  rpc ListSigners(ListSignersRequest) returns (ListSignersResponse);

  // Schedule grants (docs/implementation/schedule-grants.md): standing
  // permission, approved with the security key, to run fixed actions that
  // the executor rates LOW on fixed hosts at most once per interval, until
  // the grant expires or is revoked.
  //
  // Role: server. Checks a grant document (privileged session required)
  // and returns the challenge to approve it.
  rpc ProposeScheduleGrant(ProposeScheduleGrantRequest) returns (ProposeScheduleGrantResponse);

  // Role: server. Approves a proposed grant with a user-verified assertion.
  rpc CommitScheduleGrant(CommitScheduleGrantRequest) returns (CommitScheduleGrantResponse);

  // Role: admin. Lists proposed grants (`nebula schedule pending`).
  rpc ListPendingScheduleGrants(ListPendingScheduleGrantsRequest) returns (ListPendingScheduleGrantsResponse);

  // Role: admin. Hardened approval path (`nebula schedule approve`).
  rpc ApproveScheduleGrantCLI(ApproveScheduleGrantCLIRequest) returns (ApproveScheduleGrantCLIResponse);

  // Role: server, admin.
  rpc ListScheduleGrants(ListScheduleGrantsRequest) returns (ListScheduleGrantsResponse);

  // Role: server, admin. Needs no approval.
  rpc RevokeScheduleGrant(RevokeScheduleGrantRequest) returns (RevokeScheduleGrantResponse);

  // Role: server. Runs one host run under a grant, attached, like
  // RunAttached: the grant must cover action, artifact, parameters and the
  // pinned host, the action must still be LOW there, and the interval must
  // have passed.
  rpc RunScheduled(RunScheduledRequest) returns (RunScheduledResponse);

  // Signed events (M10-1). Role: server, admin. Read-only: the chain of
  // the executor's audit events with the key to verify it.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);

  // Backup (M10-2). Role: admin. The executor's part of `nebula backup`:
  // a checked snapshot of executor.db and the encrypted SSH key files.
  rpc BackupExecutor(BackupExecutorRequest) returns (BackupExecutorResponse);
}

enum RiskClass {
  RISK_CLASS_UNSPECIFIED = 0;
  RISK_CLASS_LOW = 1;
  RISK_CLASS_MEDIUM = 2;
  RISK_CLASS_HIGH = 3;
  RISK_CLASS_CRITICAL = 4;
}

enum ApprovalRequirement {
  APPROVAL_REQUIREMENT_UNSPECIFIED = 0;
  // Issued immediately because a privileged session is active (LOW).
  APPROVAL_REQUIREMENT_NONE = 1;
  // WebAuthn assertion with user presence (MEDIUM).
  APPROVAL_REQUIREMENT_ASSERTION_PRESENCE = 2;
  // WebAuthn assertion with user verification (HIGH).
  APPROVAL_REQUIREMENT_ASSERTION_VERIFIED = 3;
  // User-verified assertion plus the typed number of targets (CRITICAL).
  APPROVAL_REQUIREMENT_ASSERTION_VERIFIED_TYPED_COUNT = 4;
  // Only `nebula approve` on the executor host (hardened mode).
  APPROVAL_REQUIREMENT_CLI_ONLY = 5;
}

enum PermitState {
  PERMIT_STATE_UNSPECIFIED = 0;
  PERMIT_STATE_PENDING = 1;
  PERMIT_STATE_APPROVED = 2;
}

message Target {
  string host_id = 1;
  // OpenSSH fingerprint of the pinned host key, "SHA256:<base64>".
  string host_key_fingerprint = 2;
}

// ExecutionRequest is the fully resolved request that a permit binds to.
// Field semantics are defined in docs/spec/07-execution-model.md.
message ExecutionRequest {
  string execution_id = 1;
  string action_id = 2;
  string module_version = 3;
  string artifact_sha256 = 4;
  string parameters_hash = 5;
  repeated string credential_refs = 6;
  RiskClass risk_class = 7;
  string stage_plan_hash = 8;
  int64 expiry_unix = 9;
  repeated Target resolved_targets = 10;
}

message GetStatusRequest {}

message GetStatusResponse {
  bool unlocked = 1;
  bool privileged_session_active = 2;
  int64 privileged_session_expiry_unix = 3;
  bool hardened_mode = 4;
  uint32 pending_permits = 5;
  uint32 approved_permits = 6;
  repeated string loaded_credential_refs = 7;
  // A TOTP recovery login happened and no new WebAuthn credential has been
  // registered since: no privileged session or browser approval until then.
  bool recovery_pending = 8;
  VaultState vault_state = 9;
}

message ProposeExecutionRequest {
  ExecutionRequest request = 1;
  // Parameters as a JSON object. Must hash (RFC 8785, SHA-256) to
  // request.parameters_hash. The executor keeps the canonical form so that
  // `nebula approve` can show it and execution uses exactly these bytes.
  bytes parameters_json = 2;
  // Raise risk_class to the executor's minimum instead of rejecting a
  // lower one. The response reports the class that was registered.
  bool raise_to_minimum = 3;
  // The stage plan document (stages-v1, see internal/stageplan); it must
  // hash (RFC 8785, SHA-256) to request.stage_plan_hash. Empty means one
  // stage of all targets, and then stage_plan_hash must be the hash of
  // {"plan":"single-stage-v1"}.
  bytes stage_plan_json = 4;
  // The artifact bytes (optional; they must hash to
  // request.artifact_sha256). The executor scans them with the Safety
  // Scanner, whose findings can raise its minimum risk (spec 10). Without
  // them the scan happens only at run time, where a raised floor refuses
  // the run (risk_above_approval).
  bytes artifact = 5;
}

message ProposeExecutionResponse {
  // Hex SHA-256 of the canonical request; also the permit identifier.
  string execution_digest = 1;
  // Exact canonical bytes that were hashed, for display and audit.
  bytes canonical_request = 2;
  ApprovalRequirement approval_requirement = 3;
  // WebAuthn challenge = SHA-256(digest || nonce || expiry). Empty when no
  // assertion is required.
  bytes challenge = 4;
  int64 challenge_expiry_unix = 5;
  PermitState state = 6;
  // The registered risk class (raised if raise_to_minimum applied).
  RiskClass risk_class = 7;
  // CredentialRequestOptions JSON over the challenge for
  // navigator.credentials.get(); empty when no assertion is required.
  bytes request_options_json = 8;
}

message SubmitAssertionRequest {
  string execution_digest = 1;
  // PublicKeyCredential JSON as produced by navigator.credentials.get().
  bytes assertion_json = 2;
  // Required for CRITICAL: the number of targets the operator typed.
  uint32 typed_target_count = 3;
}

message SubmitAssertionResponse {
  PermitState state = 1;
}

message BeginPrivilegedSessionRequest {}

message BeginPrivilegedSessionResponse {
  bytes challenge = 1;
  int64 challenge_expiry_unix = 2;
  string rp_id = 3;
  // CredentialRequestOptions JSON for navigator.credentials.get() over the
  // challenge (registered credentials, user verification required).
  bytes request_options_json = 4;
}

message CompletePrivilegedSessionRequest {
  bytes assertion_json = 1;
}

message CompletePrivilegedSessionResponse {
  int64 session_expiry_unix = 1;
}

message AuthorizeRunRequest {
  string execution_digest = 1;
  string host_id = 2;
  string host_key_fingerprint = 3;
  string action_id = 4;
  string module_version = 5;
  // Raw artifact bytes; the executor hashes them itself.
  bytes artifact = 6;
  // Parameters as a JSON object; the executor canonicalizes and hashes it.
  bytes parameters_json = 7;
  string credential_ref = 8;
}

message AuthorizeRunResponse {
  bool authorized = 1;
}

enum UnlockScope {
  // SSH keys and, if initialized, the vault.
  UNLOCK_SCOPE_UNSPECIFIED = 0;
  UNLOCK_SCOPE_KEYS = 1;
  UNLOCK_SCOPE_VAULT = 2;
}

enum VaultState {
  VAULT_STATE_UNSPECIFIED = 0;
  VAULT_STATE_NOT_INITIALIZED = 1;
  VAULT_STATE_LOCKED = 2;
  VAULT_STATE_UNLOCKED = 3;
}

// Unlock fails with Unauthenticated only if nothing it tried could be
// unlocked; otherwise the response says which part needs another
// passphrase.
message UnlockRequest {
  bytes passphrase = 1;
  UnlockScope scope = 2;
}

message UnlockResponse {
  repeated string loaded_credential_refs = 1;
  bool keys_unlocked = 2;
  // Why the SSH keys stayed locked when they were tried (empty otherwise).
  string keys_error = 3;
  VaultState vault_state = 4;
  // The vault was tried with this passphrase and it did not fit.
  bool vault_wrong_passphrase = 5;
  // The SSH keys were tried with this passphrase and it did not fit.
  bool keys_wrong_passphrase = 6;
}

message LockRequest {}

message LockResponse {}

message ListPendingRequest {}

message PendingPermit {
  string execution_digest = 1;
  ExecutionRequest request = 2;
  ApprovalRequirement approval_requirement = 3;
  int64 approval_expiry_unix = 4;
  // Canonical (RFC 8785) parameters as held by the executor.
  bytes canonical_parameters = 5;
  // The stage plan as held by the executor.
  repeated PlanStage stage_plan = 6;
}

// One stage of an approved plan.
message PlanStage {
  string name = 1;
  repeated string host_ids = 2;
  uint32 max_failed = 3;
  uint32 max_unreachable = 4;
  // "manual" or "auto": how the next stage opens once this one passed.
  string continue_mode = 5;
  uint32 timeout_seconds = 6;
}

enum GateKind {
  GATE_KIND_UNSPECIFIED = 0;
  // Open the next stage (stage is its 1-based number).
  GATE_KIND_OPEN_STAGE = 1;
  // Skip a host of an open stage that has not run (or was unreachable).
  GATE_KIND_SKIP_HOST = 2;
}

message Gate {
  GateKind kind = 1;
  uint32 stage = 2;
  string host_id = 3;
}

message HostOutcome {
  string host_id = 1;
  // succeeded, failed, unreachable or skipped.
  string outcome = 2;
}

message StageStatus {
  PlanStage stage = 1;
  bool open = 2;
  // Complete and within its thresholds.
  bool passed = 3;
  repeated HostOutcome outcomes = 4;
}

message Rollout {
  repeated StageStatus stages = 1;
  // 1-based number of the highest open stage.
  uint32 open_stage = 2;
  // Why the rollout stopped (a stage had more failures than allowed).
  string stopped = 3;
  bool aborted = 4;
  // What the next gate needs.
  ApprovalRequirement gate_requirement = 5;
}

message BeginGateRequest {
  string execution_digest = 1;
  Gate gate = 2;
}

message BeginGateResponse {
  ApprovalRequirement approval_requirement = 1;
  // Empty when the privileged session suffices.
  bytes challenge = 2;
  int64 challenge_expiry_unix = 3;
  // CredentialRequestOptions JSON over the challenge; empty without one.
  bytes request_options_json = 4;
}

message CommitGateRequest {
  string execution_digest = 1;
  Gate gate = 2;
  // PublicKeyCredential JSON; required for HIGH and CRITICAL.
  bytes assertion_json = 3;
}

message CommitGateResponse {
  Rollout rollout = 1;
}

message AbortRolloutRequest {
  string execution_digest = 1;
}

message AbortRolloutResponse {
  Rollout rollout = 1;
}

message GetRolloutRequest {
  string execution_digest = 1;
}

message GetRolloutResponse {
  Rollout rollout = 1;
}

message ApproveGateCLIRequest {
  string execution_digest = 1;
  Gate gate = 2;
}

message ApproveGateCLIResponse {
  Rollout rollout = 1;
}

message ListPendingResponse {
  repeated PendingPermit permits = 1;
}

message ApproveCLIRequest {
  string execution_digest = 1;
  // Required for CRITICAL.
  uint32 typed_target_count = 2;
}

message ApproveCLIResponse {
  PermitState state = 1;
}

message TrustArtifactRequest {
  string action_id = 1;
  string module_version = 2;
  // Declared risk; becomes the minimum risk_class for this artifact.
  RiskClass risk_class = 3;
  // Raw artifact bytes; the executor hashes them itself.
  bytes artifact = 4;
  // Free text shown by `nebula artifact list` (printable, at most 200 bytes).
  string label = 5;
  // Optional lowercase hex SHA-256 the caller computed; if set, the
  // executor refuses to store anything when its own hash differs.
  string expected_sha256 = 6;
}

message TrustArtifactResponse {
  // Lowercase hex SHA-256 the executor computed.
  string artifact_sha256 = 1;
}

message UntrustArtifactRequest {
  string artifact_sha256 = 1;
  string action_id = 2;
  string module_version = 3;
}

message UntrustArtifactResponse {
  bool removed = 1;
}

message ListTrustedArtifactsRequest {}

message TrustedArtifact {
  string artifact_sha256 = 1;
  string action_id = 2;
  string module_version = 3;
  RiskClass risk_class = 4;
  string label = 5;
  int64 trusted_at_unix = 6;
  string trusted_by = 7;
}

