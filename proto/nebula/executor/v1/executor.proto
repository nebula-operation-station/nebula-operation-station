  // The canonical grant document as approved.
  bytes canonical_grant = 3;
  string approved_by = 4;
  int64 created_unix = 5;
  int64 expiry_unix = 6;
  // 0 while active.
  int64 revoked_unix = 7;
}

message CommitScheduleGrantResponse {
  ScheduleGrant grant = 1;
}

