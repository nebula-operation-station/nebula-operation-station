message SetHostCriticalityRequest {
  string host_id = 1;
  // Required unless clear is set.
  RiskClass criticality = 2;
  // Host key, "SHA256:<base64>". Optional if the host has a pinned key
  // (then it must equal the pin); required otherwise, unless clear is set.
  string host_key_fingerprint = 3;
  // Remove the record instead; the host counts as unrecorded again.
  bool clear = 4;
}

message SetHostCriticalityResponse {
  // False when clear was sent for a host without a record.
  bool changed = 1;
  // The fingerprint the record is bound to (the pinned key if the host has
  // one).
  string host_key_fingerprint = 2;
}

message ListHostCriticalityRequest {}

message HostCriticality {
  string host_id = 1;
  RiskClass criticality = 2;
  int64 updated_at_unix = 3;
  string updated_by = 4;
  string host_key_fingerprint = 5;
}

