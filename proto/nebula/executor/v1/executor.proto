  // The signer before the change ("" for none), also in the audit line.
  string previous = 1;
}

message ListSignersRequest {}

message Signer {
  string fingerprint = 1;
  string name = 2;
  int64 added_unix = 3;
  string added_by = 4;
}

message ModuleSigner {
  string module = 1;
  string fingerprint = 2;
  string confirmed_by = 3;
  int64 updated_unix = 4;
}

message ListSignersResponse {
  repeated Signer signers = 1;
  // The signer each module is bound to.
  repeated ModuleSigner modules = 2;
}

message ListEventsRequest {
  // Events with a sequence number above this one, oldest first.
  int64 after_seq = 1;
  // At most this many (1 to 1000; 0 means 100).
  int32 limit = 2;
  // When set, return the newest `limit` events instead (after_seq is
  // ignored).
  bool newest = 3;
}

// One signed event (M10-1): body is the canonical JSON (RFC 8785) of
// {seq, time, kind, attrs}; hash = SHA-256(prev_hash || body); signature is
// Ed25519 over hash with the executor's event key.
message Event {
  int64 seq = 1;
  bytes body = 2;
  bytes prev_hash = 3;
  bytes hash = 4;
  bytes signature = 5;
}

message ListEventsResponse {
  repeated Event events = 1;
  // The event key (Ed25519, 32 bytes) and the newest sequence number.
  bytes public_key = 2;
  int64 head_seq = 3;
  // Every key that signed the chain, from its first event on (a restore
  // onto a new machine starts a new key).
  repeated EventKey keys = 4;
}

message EventKey {
  int64 first_seq = 1;
  bytes public_key = 2;
}

message BackupExecutorRequest {}

// One file of the executor's part of a backup: "executor.db" (a checked
// snapshot) and "keys/<ref>.key" / "keys/<ref>.pub" (the SSH keys, still
// encrypted with the passphrase). Never the event key or anything
// decrypted.
message BackupFile {
  string name = 1;
  uint32 mode = 2;
  bytes data = 3;
}

message BackupExecutorResponse {
  repeated BackupFile files = 1;
  int32 schema_version = 2;
  string version = 3;
}
