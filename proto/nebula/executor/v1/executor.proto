message RunScheduledRequest {
  string grant_id = 1;
  // The run; execution_digest stays empty, the executor names the run.
  AuthorizeRunRequest run = 2;
  repeated string endpoints = 3;
  uint32 timeout_seconds = 4;
}

message RunScheduledResponse {
  // The execution ID the executor gave the run.
  string execution_id = 1;
  RunAttachedResponse result = 2;
}

message BeginTrustArtifactRequest {
  bytes artifact = 1;
  string action_id = 2;
  string module_version = 3;
  RiskClass risk_class = 4;
  // Shown in `nebula artifact list`; plain text, at most 200 characters.
  string label = 5;
}

message BeginTrustArtifactResponse {
  string trust_id = 1;
  string artifact_sha256 = 2;
  bytes challenge = 3;
  bytes request_options_json = 4;
  int64 challenge_expiry_unix = 5;
}

message CommitTrustArtifactRequest {
  string trust_id = 1;
  bytes assertion_json = 2;
}

message CommitTrustArtifactResponse {
  string artifact_sha256 = 1;
}

message GetArtifactTrustRequest {
  string artifact_sha256 = 1;
  string action_id = 2;
  string module_version = 3;
}

message GetArtifactTrustResponse {
  bool trusted = 1;
  RiskClass risk_class = 2;
}

message RegisterModuleRequest {
  bytes lock_json = 1;
  bytes signature = 2;
  // Script files by the paths the lock names.
  map<string, bytes> scripts = 3;
}

message ModuleAction {
  string action_id = 1;
  string module_version = 2;
  string artifact_sha256 = 3;
  RiskClass risk_class = 4;
}

message RegisterModuleResponse {
  string name = 1;
  string version = 2;
  string lock_sha256 = 3;
  string signer_fingerprint = 4;
  string signer_name = 5;
  repeated ModuleAction actions = 6;
}

message AddSignerRequest {
  // One authorized_keys line (ssh-ed25519 only).
  string public_key = 1;
  string name = 2;
}

message AddSignerResponse {
  string fingerprint = 1;
}

message RemoveSignerRequest {
  string fingerprint = 1;
}

message RemoveSignerResponse {
  bool removed = 1;
  int64 trust_entries_removed = 2;
}

message ConfirmModuleSignerRequest {
  string module = 1;
  string fingerprint = 2;
  // The module's signer the admin saw ("" for none); refused when the
  // executor's record differs (failed_precondition).
  string expected_previous = 3;
}

message ConfirmModuleSignerResponse {
  // The signer before the change ("" for none), also in the audit line.
  string previous = 1;
}

message ListSignersRequest {}

message Signer {
  string fingerprint = 1;
  string name = 2;
  int64 added_unix = 3;
  string added_by = 4;
}

message ModuleSigner {
  string module = 1;
  string fingerprint = 2;
  string confirmed_by = 3;
  int64 updated_unix = 4;
}

message ListSignersResponse {
  repeated Signer signers = 1;
  // The signer each module is bound to.
  repeated ModuleSigner modules = 2;
}

message ListEventsRequest {
  // Events with a sequence number above this one, oldest first.
  int64 after_seq = 1;
  // At most this many (1 to 1000; 0 means 100).
  int32 limit = 2;
  // When set, return the newest `limit` events instead (after_seq is
  // ignored).
  bool newest = 3;
}

// One signed event (M10-1): body is the canonical JSON (RFC 8785) of
// {seq, time, kind, attrs}; hash = SHA-256(prev_hash || body); signature is
// Ed25519 over hash with the executor's event key.
message Event {
  int64 seq = 1;
  bytes body = 2;
  bytes prev_hash = 3;
  bytes hash = 4;
  bytes signature = 5;
}

message ListEventsResponse {
  repeated Event events = 1;
  // The event key (Ed25519, 32 bytes) and the newest sequence number.
  bytes public_key = 2;
  int64 head_seq = 3;
  // Every key that signed the chain, from its first event on (a restore
  // onto a new machine starts a new key).
  repeated EventKey keys = 4;
}

message EventKey {
  int64 first_seq = 1;
  bytes public_key = 2;
}

message BackupExecutorRequest {}

// One file of the executor's part of a backup: "executor.db" (a checked
// snapshot) and "keys/<ref>.key" / "keys/<ref>.pub" (the SSH keys, still
// encrypted with the passphrase). Never the event key or anything
// decrypted.
message BackupFile {
  string name = 1;
  uint32 mode = 2;
  bytes data = 3;
}

message BackupExecutorResponse {
  repeated BackupFile files = 1;
  int32 schema_version = 2;
  string version = 3;
}

// PVE provider read RPCs (ADR 0006). The executor alone talks to PVE;
// these messages are the typed read surface the pve-collector schedules.
// Responses carry sanitized, pvecontract-shaped observation data: no
// credentials, no raw API output, no task logs.

// PVERemoteKind is the kind of a PVE remote.
enum PVERemoteKind {
  PVE_REMOTE_KIND_UNSPECIFIED = 0;
  PVE_REMOTE_KIND_CLUSTER = 1;
  PVE_REMOTE_KIND_STANDALONE = 2;
}

// PVERemoteState is the connection state of a remote.
enum PVERemoteState {
  PVE_REMOTE_STATE_UNSPECIFIED = 0;
  PVE_REMOTE_STATE_ACTIVE = 1;
  // BLOCKED: a changed pin, invalid chain or SAN mismatch blocks the whole
  // remote persistently until an admin re-pins it.
  PVE_REMOTE_STATE_BLOCKED = 2;
}

// PVEEndpoint is one ordered node API endpoint of a remote.
message PVEEndpoint {
  string host = 1;
  uint32 port = 2;
}

// PVERemoteInfo is the nonsecret metadata of one PVE remote.
message PVERemoteInfo {
  string remote_id = 1;
  string name = 2;
  PVERemoteKind kind = 3;
  repeated PVEEndpoint endpoints = 4;
  // The SHA-256 fingerprint of the pinned CA (cluster) or leaf (standalone)
  // certificate. A trust identifier, not a secret.
  string trust_pin = 5;
  uint64 trust_generation = 6;
  PVERemoteState state = 7;
}

message ListPVERemotesRequest {}

message ListPVERemotesResponse {
  repeated PVERemoteInfo remotes = 1;
}

// PVEReadMethod is the typed enumeration method of one PVE remote. The set
// is final (ADR 0006, P1-05): no free-form URL, no generic proxy.
enum PVEReadMethod {
  PVE_READ_METHOD_UNSPECIFIED = 0;
  PVE_READ_METHOD_NODES = 1;
  PVE_READ_METHOD_GUESTS = 2;
  PVE_READ_METHOD_GUEST_CONFIG = 3;
  PVE_READ_METHOD_GUEST_AGENT = 4;
  PVE_READ_METHOD_STORAGE = 5;
  PVE_READ_METHOD_SNAPSHOTS = 6;
  PVE_READ_METHOD_CLUSTER = 7;
  PVE_READ_METHOD_TASKS = 8;
  PVE_READ_METHOD_BACKUPS = 9;
  PVE_READ_METHOD_METRICS = 10;
}

// PVEDatasetState mirrors pvecontract.Availability: AVAILABLE with an empty
// value means "nothing found"; UNAVAILABLE with a reason means "could not
// be read".
enum PVEDatasetState {
  PVE_DATASET_STATE_UNSPECIFIED = 0;
  PVE_DATASET_STATE_AVAILABLE = 1;
  PVE_DATASET_STATE_UNAVAILABLE = 2;
}

// PVEReadNodeParams scopes NODES to one node (empty: all nodes).
message PVEReadNodeParams {
  string node = 1;
}

// PVEReadGuestParams scopes a guest method to one guest.
message PVEReadGuestParams {
  uint64 vmid = 1;
}

// PVEReadMetricsParams names one exact metrics target of METRICS (spec 17
// "SSH/provider telemetry leases"): the node itself (kind "node", vmid 0,
// generation 0) or one QEMU/LXC guest on that node with its local guest
// generation. A provider telemetry grant must list exactly this target.
// live selects the 10-second on-demand path (a visible chart or details
// page); otherwise the read is a 5-minute scheduled history sample.
message PVEReadMetricsParams {
  string node = 1;
  string kind = 2;
  uint64 vmid = 3;
  uint64 generation = 4;
  bool live = 5;
}

// ReadPVERequest is one typed read. Exactly the parameter shape the method
// accepts may be set (see executor.ValidateReadPVERequest).
message ReadPVERequest {
  string remote_id = 1;
  PVEReadMethod method = 2;
  oneof params {
    PVEReadNodeParams node = 3;
    PVEReadGuestParams guest = 4;
    PVEReadMetricsParams metrics = 5;
  }
}

// ReadPVEResponse is one pvecontract-shaped observation page for one
// remote. Exactly one payload is set, matching the requested method.
message ReadPVEResponse {
  string remote_id = 1;
  int64 observed_at_unix = 2;
  uint64 collection_generation = 3;
  oneof payload {
    PVENodes nodes = 4;
    PVEGuests guests = 5;
    PVEGuestConfig guest_config = 6;
    PVEGuestAgent guest_agent = 7;
    PVEStorages storages = 8;
    PVESnapshots snapshots = 9;
    PVECluster cluster = 10;
    PVETasks tasks = 11;
    PVEBackups backups = 12;
    PVEMetrics metrics = 13;
  }
}

// PVENodes is the 60-second node inventory.
message PVENodes {
  PVEDatasetState state = 1;
  string reason = 2;
  repeated PVENode nodes = 3;
}

message PVENode {
  string node = 1;
  string status = 2;
  uint64 uptime_seconds = 3;
  uint32 cpu_count = 4;
  uint64 ram_total_bytes = 5;
  uint64 ram_used_bytes = 6;
  // The 15-minute node details read.
  PVENodeDetails details = 7;
}

message PVENodeDetails {
  PVEDatasetState state = 1;
  string reason = 2;
  string pve_version = 3;
  string kernel_version = 4;
}

// PVEGuests is the 60-second guest inventory.
message PVEGuests {
  PVEDatasetState state = 1;
  string reason = 2;
  repeated PVEGuest guests = 3;
}

message PVEGuest {
  uint64 vmid = 1;
  string kind = 2;
  string node = 3;
  string name = 4;
  string status = 5;
  uint64 generation = 6;
  string uuid = 7;
}

// PVEGuestConfig is the 5-minute guest configuration read for one guest.
message PVEGuestConfig {
  PVEDatasetState state = 1;
  string reason = 2;
  uint64 vmid = 3;
  uint32 cpu_count = 4;
  uint64 ram_bytes = 5;
  repeated PVEDisk disks = 6;
  repeated string boot_order = 7;
  repeated PVEHostPCI hostpci = 8;
  PVECloudInitIP cloud_init_ip = 9;
  repeated string tags = 10;
  string pool = 11;
  PVEGuestCapabilities capabilities = 12;
}

message PVEDisk {
  string storage = 1;
  string volume = 2;
  string format = 3;
  uint64 size_bytes = 4;
}

message PVEHostPCI {
  string id = 1;
  string device = 2;
  string target = 3;
}

message PVECloudInitIP {
  string ip = 1;
  string gateway = 2;
  repeated string nameservers = 3;
}

// PVEGuestCapabilities mirrors pvecontract.GuestCapabilities (tri-state
// strings: "yes", "no", "unknown").
message PVEGuestCapabilities {
  string snapshots = 1;
  string live_migration = 2;
  string ram_snapshots = 3;
}

// PVEGuestAgent is the QEMU guest agent summary for one guest.
message PVEGuestAgent {
  PVEDatasetState state = 1;
  string reason = 2;
  uint64 vmid = 3;
  string hostname = 4;
  string os = 5;
  repeated PVEFilesystem filesystems = 6;
}

message PVEFilesystem {
  string mount_point = 1;
  string fstype = 2;
  uint64 size_bytes = 3;
  uint64 used_bytes = 4;
}

// PVEStorages is the 5-minute storage read: one entry per (node, storage)
// as each online node reports it. A shared storage appears once per
// reporting node with shared = true and is counted once downstream.
message PVEStorages {
  PVEDatasetState state = 1;
  string reason = 2;
  repeated PVEStorage storages = 3;
}

message PVEStorage {
  string name = 1;
  string type = 2;
  string format = 3;
  repeated string content = 4;
  bool active = 5;
  // 0 when the capacity is unknown (inactive storage or not reported);
  // never a measured empty store.
  uint64 size_bytes = 6;
  uint64 free_bytes = 7;
  // Node that reported this storage and its usage.
  string node = 8;
  // PVE's authoritative shared flag.
  bool shared = 9;
}

// PVESnapshots is the 5-minute snapshot read for one guest.
message PVESnapshots {
  PVEDatasetState state = 1;
  string reason = 2;
  uint64 vmid = 3;
  repeated PVESnapshot snapshots = 4;
}

message PVESnapshot {
  string name = 1;
  int64 time_unix = 2;
  string parent = 3;
  bool has_ram = 4;
}

// PVECluster is the 60-second cluster and HA read.
message PVECluster {
  PVEDatasetState state = 1;
  string reason = 2;
  repeated PVEClusterNode nodes = 3;
  string quorum = 4;
  repeated PVEHAResource ha_resources = 5;
}

// PVEClusterNode is one cluster member. vote_state ("yes", "no",
// "unknown") reports whether the node carries a corosync quorum vote
// (GET /cluster/config/nodes); maintenance_state reports whether its HA
// local resource manager is in maintenance mode (GET
// /cluster/ha/status/current). Either is "unknown" when PVE did not report
// it (no Sys.Audit, no HA, no LRM entry). vote and maintenance are true
// only for "yes": false never means a known "no" without the state field.
message PVEClusterNode {
  string node = 1;
  string status = 2;
  bool vote = 3;
  bool maintenance = 4;
  string vote_state = 5;
  string maintenance_state = 6;
}

message PVEHAResource {
  string id = 1;
  string kind = 2;
  uint64 vmid = 3;
  string desired = 4;
  string observed = 5;
  string node = 6;
}

// PVETasks is the bounded task metadata read. Never raw task logs.
// PVETasks is the task metadata of the last 24 hours of every online node,
// newest first per node. truncated reports that at least one node had more
// tasks in the window than its per-node share: its oldest tasks in the
// window are missing, so the list is not that node's complete history.
message PVETasks {
  PVEDatasetState state = 1;
  string reason = 2;
  repeated PVETask tasks = 3;
  bool truncated = 4;
}

message PVETask {
  string node = 1;
  string actor = 2;
  string type = 3;
  string target = 4;
  int64 started_unix = 5;
  string exit_status = 6;
}

// PVEBackups is the 5-minute nonsecret backup evidence read for one guest.
// It has two independent parts:
//
//   - state/reason cover task evidence: the newest vzdump task summaries
//     whose target is this VMID on every online node within the evidence
//     window (kind "task", status success/failed/running/unknown,
//     verified "unknown"). Task success is evidence of a past run, never
//     proof that a backup exists or is restorable.
//   - catalog_state/catalog_reason cover catalog evidence (kind "catalog",
//     status present/unknown, verified yes/no/unknown). PVE silently
//     filters storage content listings for tokens without VM.Backup and
//     Datastore.AllocateSpace, and the registry does not record the read
//     token's privileges, so the catalog is UNAVAILABLE until the executor
//     learns the scope. backups then contains no catalog entry; a consumer
//     must never read the absence of catalog entries as "no backups".
message PVEBackups {
  PVEDatasetState state = 1;
  string reason = 2;
  uint64 vmid = 3;
  repeated PVEBackupEvidence backups = 4;
  PVEDatasetState catalog_state = 5;
  string catalog_reason = 6;
}

message PVEBackupEvidence {
  string source = 1;
  string kind = 2;
  string status = 3;
  string name = 4;
  int64 started_unix = 5;
  int64 finished_unix = 6;
  string verified = 7;
}

// PVEMetrics is one bounded current-status metrics sample of the requested
// target (vmid 0: the node). Metric names and units are fixed by the
// executor; values are normalized (ADR 0006, P1-21). A metric PVE did not
// report is absent, never zero. status is the raw-checked PVE status
// mapped to a fixed set.
message PVEMetrics {
  PVEDatasetState state = 1;
  string reason = 2;
  uint64 vmid = 3;
  repeated PVEMetric metrics = 4;
  string node = 5;
  string kind = 6;
  string status = 7;
}

message PVEMetric {
  string name = 1;
  string unit = 2;
  double value = 3;
}

// ProbePVERemoteRequest names approved endpoints for credential-free probing.
message ProbePVERemoteRequest {
  string kind = 1;
  repeated PVEEndpoint endpoints = 2;
}

message PVEProbeEndpoint {
  string host = 1;
  uint32 port = 2;
  string leaf_fingerprint = 3;
  string ca_fingerprint = 4;
}

message ProbePVERemoteResponse {
  repeated PVEProbeEndpoint endpoints = 1;
  string trust_pin = 2;
}

// PVEAdminRemote is metadata only; token values never leave the executor.
message PVEAdminRemote {
  string remote_id = 1;
  string name = 2;
  string kind = 3;
  repeated PVEEndpoint endpoints = 4;
  string trust_pin = 5;
  uint64 trust_generation = 6;
  string state = 7;
  string read_ref = 8;
  int64 read_version = 9;
  string action_ref = 10;
  int64 action_version = 11;
  int64 updated_at_unix = 12;
}

message AddPVERemoteRequest {
  string remote_id = 1;
  string name = 2;
  string kind = 3;
  repeated PVEEndpoint endpoints = 4;
  string confirmed_pin = 5;
  bytes read_token = 6;
  bytes action_token = 7;
}

message RotatePVETokenRequest {
  string remote_id = 1;
  string purpose = 2;
  bytes token = 3;
}

message RemovePVERemoteRequest {
  string remote_id = 1;
}

message ListPVEAdminRemotesRequest {}

message ListPVEAdminRemotesResponse {
  repeated PVEAdminRemote remotes = 1;
}

message ProposePVERepinRequest {
  string remote_id = 1;
  string old_pin = 2;
  string confirmed_new_pin = 3;
}

message CommitPVERepinRequest {
  string remote_id = 1;
  string old_pin = 2;
  string confirmed_new_pin = 3;
  string execution_digest = 4;
}

message AddPVERemoteResponse {
  PVEAdminRemote remote = 1;
}

message RotatePVETokenResponse {
  PVEAdminRemote remote = 1;
}

message RemovePVERemoteResponse {
  PVEAdminRemote remote = 1;
}

message CommitPVERepinResponse {
  PVEAdminRemote remote = 1;
}

message ProposePVERepinResponse {
  ProposeExecutionResponse permit = 1;
}

// PVEGuestPowerTarget names one power action on one exact guest. The
// executor reads the guest's configuration, generation and state itself.
message PVEGuestPowerTarget {
  string remote_id = 1;
  // "qemu" or "lxc".
  string kind = 2;
  string node = 3;
  uint64 vmid = 4;
  // "shutdown", "reboot", "stop" or "reset" (QEMU only).
  string verb = 5;
  // Shutdown/reboot timeout in seconds (0: executor default); must be 0
  // for stop and reset.
  uint32 timeout_sec = 6;
}

message ProposePVEGuestPowerRequest {
  PVEGuestPowerTarget target = 1;
}

message ProposePVEGuestPowerResponse {
  ProposeExecutionResponse permit = 1;
}

message CommitPVEGuestPowerRequest {
  // The same target and verb that were proposed and approved.
  PVEGuestPowerTarget target = 1;
  string execution_digest = 2;
}

// PVEGuestPowerStep is the durable job record of the power step.
message PVEGuestPowerStep {
  // "dispatching", "running", "reconciling", "succeeded", "failed" or
  // "unknown".
  string state = 1;
  string upid = 2;
  string task_type = 3;
}

message CommitPVEGuestPowerResponse {
  string execution_id = 1;
  repeated PVEGuestPowerStep steps = 2;
}

// PVEGuestSnapshotTarget names one snapshot action on one exact guest. The
// executor reads the guest's configuration, storages and snapshot list
// itself and binds them in the approval.
message PVEGuestSnapshotTarget {
  string remote_id = 1;
  // "qemu" or "lxc".
  string kind = 2;
  string node = 3;
  uint64 vmid = 4;
  // "create", "delete" or "rollback". There is no bulk or age-based op.
  string op = 5;
  // The exact snapshot name.
  string name = 6;
  // create only: include RAM (QEMU, running guest).
  bool vmstate = 7;
  // rollback only: the explicit start flag.
  bool start = 8;
  // delete and rollback: the exact snapshot identity shown in the
  // approval; required on commit, checked on propose when set.
  PVESnapshotIdentity expect = 9;
}

// PVESnapshotIdentity is one exact snapshot: name, generation (snaptime,
// parent) and RAM flag.
message PVESnapshotIdentity {
  string name = 1;
  int64 snaptime_unix = 2;
  string parent = 3;
  bool vmstate = 4;
}

message ProposePVEGuestSnapshotRequest {
  PVEGuestSnapshotTarget target = 1;
}

message ProposePVEGuestSnapshotResponse {
  ProposeExecutionResponse permit = 1;
  // delete and rollback: the exact snapshot bound in the approval.
  PVESnapshotIdentity snapshot = 2;
  // rollback: the guest runs after the rollback (start flag, or a RAM
  // snapshot, which PVE resumes whatever the start flag says).
  bool guest_runs_after = 3;
}

message CommitPVEGuestSnapshotRequest {
  // The same target that was proposed and approved, with expect set for
  // delete and rollback.
  PVEGuestSnapshotTarget target = 1;
  string execution_digest = 2;
}

message CommitPVEGuestSnapshotResponse {
  string execution_id = 1;
  repeated PVEGuestPowerStep steps = 2;
}

// ReadGrantTrigger selects one approved trigger for one run. It grants no
// additional authority. Unspecified and unknown values are rejected.
enum ReadGrantTrigger {
  READ_GRANT_TRIGGER_UNSPECIFIED = 0;
  READ_GRANT_TRIGGER_SCHEDULED = 1;
  READ_GRANT_TRIGGER_ON_DEMAND = 2;
}

message ProposeReadGrantRequest {
  // Strict read-grant-v2 JSON, 1..256 KiB; at most 32 actions/1,000 hosts.
  bytes grant_json = 1;
}

message ProposeReadGrantResponse {
  string grant_digest = 1;
  // Complete canonical document; never a truncated approval scope.
  bytes canonical_grant = 2;
  ApprovalRequirement approval_requirement = 3;
  bytes challenge = 4;
  int64 challenge_expiry_unix = 5;
  bytes request_options_json = 6;
}

message CommitReadGrantRequest {
  // Exactly 64 lowercase hexadecimal characters.
  string grant_digest = 1;
  // UTF-8 WebAuthn assertion JSON, 1..16 KiB. Verified by the executor.
  bytes assertion_json = 2;
}

// ReadGrant is durable authority, distinct from a legacy ScheduleGrant.
message ReadGrant {
  string grant_id = 1;
  string grant_digest = 2;
  bytes canonical_grant = 3;
  string approved_by = 4;
  int64 created_unix = 5;
  int64 expiry_unix = 6;
  // Zero while active.
  int64 revoked_unix = 7;
}

message CommitReadGrantResponse {
  ReadGrant grant = 1;
}

message ListPendingReadGrantsRequest {}

message PendingReadGrant {
  string grant_digest = 1;
  bytes canonical_grant = 2;
  int64 approval_expiry_unix = 3;
}

// Lists fail with ResourceExhausted above the executor's response bound;
// no approval document or list is silently truncated.
message ListPendingReadGrantsResponse {
  repeated PendingReadGrant grants = 1;
}

message ApproveReadGrantCLIRequest {
  string grant_digest = 1;
}

message ApproveReadGrantCLIResponse {
  ReadGrant grant = 1;
}

message ListReadGrantsRequest {}

message ListReadGrantsResponse {
  repeated ReadGrant grants = 1;
}

message RevokeReadGrantRequest {
  // Lowercase UUID v4, exactly 36 bytes.
  string grant_id = 1;
}

message RevokeReadGrantResponse {}

message RunReadGrantRequest {
  string grant_id = 1;
  // execution_digest must be empty. Exact artifact/parameters/credential
  // binding is rechecked against the approved grant on every run.
  AuthorizeRunRequest run = 2;
  // 1..8 endpoints, each at most 1,024 bytes.
  repeated string endpoints = 3;
  // Zero selects the executor default; maximum 600 seconds.
  uint32 timeout_seconds = 4;
  ReadGrantTrigger trigger = 5;
}

message RunReadGrantResponse {
  string execution_id = 1;
  RunAttachedResponse result = 2;
}

// Batch plan (ADR 0007, E19b). The complete bounded plan: the parent batch
// and its members, with the stage/dependency graph that links them. This is
// never a truncated approval scope; the full plan is always returned. The
// canonical_batch bytes sent next to it are authoritative; this is a typed
// view of every member and of the complete stage/dependency graph.
message BatchPlan {
  // Parent batch identity.
  string batch_id = 1;
  int64 expiry_unix = 2;
  // Members in plan order; each is bound to the parent by its stage plan hash.
  repeated BatchMember members = 3;
  repeated BatchStage stages = 4;
  repeated BatchDependency dependencies = 5;
  // Parent stage plan hash; every member's stage_plan_hash equals it.
  string stage_plan_hash = 6;
  string batch_version = 7;
}

message BatchMember {
  string member_id = 1;
  string action_id = 2;
  string module_version = 3;
  RiskClass risk = 4;
  repeated string host_ids = 5;
  // Must equal the parent stage plan hash (parent/member linkage).
  string stage_plan_hash = 6;
  // Executor-bound member execution ID; a member runs only under this ID
  // and only as a child of the approved parent digest.
  string execution_id = 7;
  string artifact_sha256 = 8;
  string parameters_hash = 9;
  repeated string credential_refs = 10;
}

message BatchStage {
  string stage_id = 1;
  // "manual" or "automatic".
  string gate = 2;
  repeated string member_ids = 3;
  repeated string required_postchecks = 4;
  // Absolute counts; zero stops on the first failed or unreachable member.
  int32 failure_threshold = 5;
  int32 unreachable_threshold = 6;
}

message BatchDependency {
  string member_id = 1;
  repeated string depends_on = 2;
}

// Host-author text from a member scan; rendered as untrusted text only.
message BatchFinding {
  string category = 1;
  RiskClass risk = 2;
  int32 line = 3;
  string excerpt = 4;
}

// Scanner findings for one member, in plan order.
message BatchMemberFindings {
  repeated BatchFinding findings = 1;
}

// One exact artifact and parameter document for a batch member.
message BatchMemberInput {
  string member_id = 1;
  bytes artifact = 2;
  bytes parameters_json = 3;
}

message ProposeBatchRequest {
  // Strict canonical batch JSON, at most 2 MiB; at most 100 members and
  // 20 stages. The complete plan is frozen and never truncated.
  bytes batch_json = 1;
  // One exact artifact and parameter document per member, in plan order.
  repeated BatchMemberInput members = 2;
}

message ProposeBatchResponse {
  string batch_digest = 1;
  // Complete canonical plan; never a truncated approval scope.
  bytes canonical_batch = 2;
  BatchPlan plan = 3;
  RiskClass risk = 4;
  ApprovalRequirement approval_requirement = 5;
  bytes challenge = 6;
  int64 challenge_expiry_unix = 7;
  bytes request_options_json = 8;
  // State after propose: APPROVED for LOW, PENDING otherwise.
  PermitState state = 9;
}

message CommitBatchRequest {
  // Exactly 64 lowercase hexadecimal characters.
  string batch_digest = 1;
  // UTF-8 WebAuthn assertion JSON, 1..16 KiB. Verified by the executor.
  bytes assertion_json = 2;
}

message CommitBatchResponse {
  PermitState state = 1;
}

message ReviewBatchRequest {
  string batch_digest = 1;
}

message ReviewBatchResponse {
  string batch_digest = 1;
  bytes canonical_batch = 2;
  BatchPlan plan = 3;
  RiskClass risk = 4;
  PermitState state = 5;
  string approved_by = 6;
  int64 approval_expiry_unix = 7;
  // Member parameters in plan order (opaque secret references only).
  repeated bytes member_parameters = 8;
  // Scanner findings in member order; host-author text.
  repeated BatchMemberFindings member_findings = 9;
}

message ApproveBatchCLIRequest {
  string batch_digest = 1;
}

message ApproveBatchCLIResponse {
  PermitState state = 1;
  string approved_by = 2;
}

message GetBatchStatusRequest {
  string batch_digest = 1;
}

message GetBatchStatusResponse {
  string batch_digest = 1;
  PermitState state = 2;
  RiskClass risk = 3;
  // Parent/member linkage: the parent batch and its member IDs.
  string batch_id = 4;
  repeated string member_ids = 5;
  string approved_by = 6;
  int64 approval_expiry_unix = 7;
  int64 expiry_unix = 8;
  // Parent stage plan hash, and each member's execution ID in member order.
  string stage_plan_hash = 9;
  repeated string member_execution_ids = 10;
}

// Built-in trust (ADR 0007, E19c).

enum BuiltinTrustChange {
  BUILTIN_TRUST_CHANGE_UNSPECIFIED = 0;
  // No locally retained predecessor; shown in full.
  BUILTIN_TRUST_CHANGE_NEW = 1;
  // Differs from the trusted version.
  BUILTIN_TRUST_CHANGE_CHANGED = 2;
  // Byte-identical to the trusted version; needs no confirmation.
  BUILTIN_TRUST_CHANGE_UNCHANGED = 3;
  // Returns to a retained earlier version.
  BUILTIN_TRUST_CHANGE_REACTIVATED = 4;
  // Trusted locally but absent from the release.
  BUILTIN_TRUST_CHANGE_REMOVED = 5;
}

enum BuiltinTrustState {
  BUILTIN_TRUST_STATE_UNSPECIFIED = 0;
  // Every built-in in the local release is trusted.
  BUILTIN_TRUST_STATE_TRUSTED = 1;
  // At least one built-in in the local release is not trusted yet.
  BUILTIN_TRUST_STATE_UNTRUSTED = 2;
  // No verified local release bundle or trust store is available.
  BUILTIN_TRUST_STATE_UNAVAILABLE = 3;
}

enum BuiltinDiffOp {
  BUILTIN_DIFF_OP_UNSPECIFIED = 0;
  BUILTIN_DIFF_OP_EQUAL = 1;
  BUILTIN_DIFF_OP_INSERT = 2;
  BUILTIN_DIFF_OP_DELETE = 3;
}

// One line of a full script diff; host-author text, render as text only.
message BuiltinDiffLine {
  BuiltinDiffOp op = 1;
  string text = 2;
  // Set when the script line is not valid UTF-8: text is then the Go
  // quoted (escaped ASCII) form of the exact bytes, never a lossy repair.
  bool escaped = 3;
}

// One executor scanner finding; the excerpt is host-author text.
message BuiltinScanFinding {
  string category = 1;
  RiskClass risk = 2;
  int32 line = 3;
  string excerpt = 4;
}

message BuiltinActionReview {
  string action_id = 1;
  BuiltinTrustChange change = 2;
  string old_risk = 3;
  string new_risk = 4;
  string old_script_sha256 = 5;
  string new_script_sha256 = 6;
  string old_artifact_sha256 = 7;
  string new_artifact_sha256 = 8;
  repeated BuiltinDiffLine diff = 9;
  repeated BuiltinScanFinding findings = 10;
  // Highest risk among the findings; unspecified when clean.
  RiskClass scanner_floor = 11;
}

message BuiltinModuleReview {
  string name = 1;
  BuiltinTrustChange change = 2;
  string old_version = 3;
  string old_sha256 = 4;
  string new_version = 5;
  string new_sha256 = 6;
  // Set when no exact previous bytes are available: nothing is inferred
  // unchanged.
  bool full_review = 7;
  string full_review_reason = 8;
  repeated BuiltinActionReview actions = 9;
}

message ReviewBuiltinTrustRequest {}

message ReviewBuiltinTrustResponse {
  string manifest_digest = 1;
  string release_version = 2;
  string root_id = 3;
  string root_fingerprint = 4;
  int64 generation = 5;
  bool needs_confirmation = 6;
  repeated BuiltinModuleReview modules = 7;
  // Old versions (name@version) the commit must retain or retire.
  repeated string old_versions = 8;
}

message CommitBuiltinTrustRequest {
  // The reviewed manifest digest the admin confirmed.
  string manifest_digest = 1;
  // Old versions (name@version) to retain (pin).
  repeated string retain = 2;
  // Old versions (name@version) to retire.
  repeated string retire = 3;
}

// One old/new trust tuple of the commit audit.
message BuiltinTrustTuple {
  string module = 1;
  string old_version = 2;
  string old_sha256 = 3;
  string new_version = 4;
  string new_sha256 = 5;
  BuiltinTrustChange change = 6;
}

message UnpinBuiltinVersionRequest {
  // The pinned version (name@version) to unpin.
  string version = 1;
}

message UnpinBuiltinVersionResponse {
  string version = 1;
  int64 generation = 2;
  uint32 admin_uid = 3;
  // The versions still pinned after the unpin (name@version).
  repeated string remaining_pins = 4;
}

message CommitBuiltinTrustResponse {
  string manifest_digest = 1;
  int64 generation = 2;
  uint32 admin_uid = 3;
  repeated string retained = 4;
  repeated string retired = 5;
  repeated string collected = 6;
  int32 cleanup_failures = 7;
  repeated BuiltinTrustTuple tuples = 8;
}

message GetBuiltinTrustStatusRequest {}

// The trust state of one built-in module version; metadata only.
message BuiltinTrustEntry {
  string name = 1;
  BuiltinTrustChange change = 2;
  // The trusted version; empty when none.
  string trusted_version = 3;
  string trusted_sha256 = 4;
  // The local release's version; empty when removed.
  string release_version = 5;
  string release_sha256 = 6;
}

message GetBuiltinTrustStatusResponse {
  BuiltinTrustState state = 1;
  string manifest_digest = 2;
  string release_version = 3;
  int64 generation = 4;
  // Every module of the review, sorted by name.
  repeated BuiltinTrustEntry modules = 5;
}

// Private registries (ADR 0006, P1-32).

enum PrivateRegistryAuthMode {
  PRIVATE_REGISTRY_AUTH_MODE_UNSPECIFIED = 0;
  // HTTP Basic credentials sent to the registry origin only.
  PRIVATE_REGISTRY_AUTH_MODE_BASIC = 1;
  // Basic credentials exchanged at the approved token realm only.
  PRIVATE_REGISTRY_AUTH_MODE_TOKEN = 2;
}

enum PrivateRegistryReadMethod {
  PRIVATE_REGISTRY_READ_METHOD_UNSPECIFIED = 0;
  // Manifest digest of one tag or digest pin (manifest HEAD).
  PRIVATE_REGISTRY_READ_METHOD_TAG_DIGEST = 1;
  // Bounded tag list of one repository.
  PRIVATE_REGISTRY_READ_METHOD_LIST_TAGS = 2;
}

message AddPrivateRegistryRequest {
  string registry_id = 1;
  // Exact HTTPS origin, for example "https://registry.example.org".
  string registry_origin = 2;
  PrivateRegistryAuthMode auth_mode = 3;
  // Exact HTTPS token realm URL for token auth; empty for basic auth.
  string realm = 4;
  string service = 5;
  // Exact approved repositories; no wildcards.
  repeated string repositories = 6;
  // Permit RFC 1918/ULA addresses for this registry.
  bool allow_private_network = 7;
  // Optional PEM CA bundle that replaces the system roots for this registry.
  string ca_pem = 8;
  string username = 9;
  bytes secret = 10;
  // Absolute credential expiry; reads pause at it until rotation.
  int64 credential_expires_unix = 11;
}

message AddPrivateRegistryResponse {
  PrivateRegistryInfo registry = 1;
}

message RotatePrivateRegistryCredentialRequest {
  string registry_id = 1;
  string username = 2;
  bytes secret = 3;
  int64 credential_expires_unix = 4;
}

message RotatePrivateRegistryCredentialResponse {
  PrivateRegistryInfo registry = 1;
}

message RemovePrivateRegistryRequest {
  string registry_id = 1;
}

message RemovePrivateRegistryResponse {}

message ListPrivateRegistriesRequest {}

message ListPrivateRegistriesResponse {
  repeated PrivateRegistryInfo registries = 1;
}

// PrivateRegistryInfo is metadata only: it never carries the user name,
// secret or any token.
message PrivateRegistryInfo {
  string registry_id = 1;
  string registry_origin = 2;
  PrivateRegistryAuthMode auth_mode = 3;
  string realm = 4;
  string service = 5;
  repeated string repositories = 6;
  bool allow_private_network = 7;
  bool custom_ca = 8;
  int64 config_version = 9;
  int64 credential_version = 10;
  int64 credential_expires_unix = 11;
}

message ReadPrivateRegistryRequest {
  string registry_id = 1;
  PrivateRegistryReadMethod method = 2;
  string repository = 3;
  // Exactly one of tag or digest for TAG_DIGEST; neither for LIST_TAGS.
  string tag = 4;
  string digest = 5;
}

message ReadPrivateRegistryResponse {
  string registry_id = 1;
  string repository = 2;
  int64 observed_at_unix = 3;
  // TAG_DIGEST: the validated manifest digest.
  string digest = 4;
  // LIST_TAGS: validated tags; incomplete when a budget ran out or invalid
  // tags were dropped, and then never "up to date".
  repeated string tags = 5;
  bool incomplete = 6;
  bool from_cache = 7;
  // The configuration and credential versions the read used.
  int64 config_version = 8;
  int64 credential_version = 9;
}
