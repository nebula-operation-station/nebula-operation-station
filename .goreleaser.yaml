# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Builds the static linux binaries (CGO off, -trimpath) into a tarball
# that also carries deploy/, so a release can be installed with
# `sudo ./deploy/install.sh` from the extracted archive.
#
# There is deliberately no signing section: the release signing key is
# an offline Ed25519 root key that is never present in CI
# (docs/adr/0001-frozen-decisions-v2.2.md). Release publishing is
# disabled for the same reason; publishing and signing happen offline.

version: 2

project_name: nebula

env:
  - CGO_ENABLED=0

builds:
  - id: nebula
    main: ./cmd/nebula
    binary: nebula
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/nebula-operation-station/nebula-operation-station/internal/version.Version={{.Version}}
      - -X github.com/nebula-operation-station/nebula-operation-station/internal/version.Commit={{.ShortCommit}}
  - id: nebula-server
    main: ./cmd/nebula-server
    binary: nebula-server
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/nebula-operation-station/nebula-operation-station/internal/version.Version={{.Version}}
      - -X github.com/nebula-operation-station/nebula-operation-station/internal/version.Commit={{.ShortCommit}}
  - id: nebula-executor
    main: ./cmd/nebula-executor
    binary: nebula-executor
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/nebula-operation-station/nebula-operation-station/internal/version.Version={{.Version}}
      - -X github.com/nebula-operation-station/nebula-operation-station/internal/version.Commit={{.ShortCommit}}
  - id: nebula-discovery
    main: ./cmd/nebula-discovery
    binary: nebula-discovery
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/nebula-operation-station/nebula-operation-station/internal/version.Version={{.Version}}
      - -X github.com/nebula-operation-station/nebula-operation-station/internal/version.Commit={{.ShortCommit}}
  - id: nebula-pve-collector
    main: ./cmd/nebula-pve-collector
    binary: nebula-pve-collector
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/nebula-operation-station/nebula-operation-station/internal/version.Version={{.Version}}
      - -X github.com/nebula-operation-station/nebula-operation-station/internal/version.Commit={{.ShortCommit}}
  - id: nebula-netdev-collector
    main: ./cmd/nebula-netdev-collector
    binary: nebula-netdev-collector
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/nebula-operation-station/nebula-operation-station/internal/version.Version={{.Version}}
      - -X github.com/nebula-operation-station/nebula-operation-station/internal/version.Commit={{.ShortCommit}}

archives:
  - id: nebula
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      # Allowlist deployment files so locally staged release attachments
      # never enter a payload whose hash their manifest must record.
      - src: deploy/*.sh
        dst: deploy/
      - src: deploy/*.md
        dst: deploy/
      - src: deploy/systemd/*
        dst: deploy/systemd/
      - src: deploy/quickstart/*.sh
        dst: deploy/quickstart/
      - src: deploy/quickstart/*.txt
        dst: deploy/quickstart/
      - src: deploy/quickstart/*.md
        dst: deploy/quickstart/
      - src: deploy/quickstart/*.py
        dst: deploy/quickstart/
      - src: deploy/deb/postinst
        dst: deploy/deb/postinst
      - src: deploy/deb/prerm
        dst: deploy/deb/prerm
      - src: deploy/deb/*_test.go
        dst: deploy/deb/
      - src: deploy/container/Dockerfile
        dst: deploy/container/Dockerfile
      - src: deploy/container/compose.yaml
        dst: deploy/container/compose.yaml
      - src: deploy/container/server.json
        dst: deploy/container/server.json
      - src: deploy/apt/*.md
        dst: deploy/apt/

# The .deb (decision 4 of the M10 plan): binaries, units and deploy/ for
# `install.sh --from-package`; the APT repository is built and signed
# offline from these packages (deploy/apt/).
nfpms:
  - id: nebula
    package_name: nebula-operation-station
    ids: [nebula, nebula-server, nebula-executor, nebula-discovery, nebula-pve-collector, nebula-netdev-collector]
    file_name_template: "nebula-operation-station_{{ .Version }}_{{ .Arch }}"
    vendor: Nebula Operation Station
    homepage: https://github.com/nebula-operation-station/nebula-operation-station
    maintainer: Nebula Operation Station maintainers <maintainers@nebula-operation-station.invalid>
    description: Self-hosted operations control plane for Linux homelabs.
    license: AGPL-3.0-or-later
    section: admin
    formats: [deb]
    bindir: /usr/bin
    recommends: [nmap]
    contents:
      # The signed manifest and bundle are separate release attachments:
      # embedding them would make the manifest reference its own payload.
      - dst: /usr/share/nebula/release
        type: dir
        file_info: {mode: 0755, owner: root, group: root}
      - src: deploy/systemd/nebula-executor.service
        dst: /lib/systemd/system/nebula-executor.service
      - src: deploy/systemd/nebula-server.service
        dst: /lib/systemd/system/nebula-server.service
      - src: deploy/systemd/nebula-discovery.service
        dst: /lib/systemd/system/nebula-discovery.service
      - src: deploy/systemd/nebula-discovery.path
        dst: /lib/systemd/system/nebula-discovery.path
      - src: deploy/systemd/nebula-discovery.timer
        dst: /lib/systemd/system/nebula-discovery.timer
      - src: deploy/systemd/nebula-pve-collector.service
        dst: /lib/systemd/system/nebula-pve-collector.service
      # Shipped, never enabled by the package: the admin enables it once
      # network devices are registered (install.sh, ND-15).
      - src: deploy/systemd/nebula-netdev-collector.service
        dst: /lib/systemd/system/nebula-netdev-collector.service
      - src: deploy/install.sh
        dst: /usr/share/nebula/deploy/install.sh
        file_info: {mode: 0755}
      - src: deploy/uninstall.sh
        dst: /usr/share/nebula/deploy/uninstall.sh
        file_info: {mode: 0755}
      - src: deploy/systemd/*
        dst: /usr/share/nebula/deploy/systemd/
      # install.sh --from-package reads the binary list (and the shared
      # parser) next to itself, so the package must ship them.
      - src: deploy/quickstart/binaries.txt
        dst: /usr/share/nebula/deploy/quickstart/binaries.txt
      - src: deploy/quickstart/binaries_lib.sh
        dst: /usr/share/nebula/deploy/quickstart/binaries_lib.sh
        file_info: {mode: 0644}
      - src: docs/admin/guide.md
        dst: /usr/share/doc/nebula-operation-station/guide.md
    scripts:
      postinstall: deploy/deb/postinst
      preremove: deploy/deb/prerm

# The container image (decision 5 of the M10 plan): the binaries on
# debian:12-slim; deploy/container/compose.yaml runs it. Pushing happens
# offline with the release, like publishing.
dockers:
  - id: nebula
    ids: [nebula, nebula-server, nebula-executor, nebula-discovery, nebula-pve-collector, nebula-netdev-collector]
    goos: linux
    goarch: amd64
    dockerfile: deploy/container/Dockerfile
    image_templates:
      - "ghcr.io/nebula-operation-station/nebula:{{ .Version }}"
    skip_push: true

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

release:
  # Offline key (ADR 0001): CI neither signs nor publishes.
  disable: true
