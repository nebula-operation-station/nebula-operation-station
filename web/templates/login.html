{{define "content"}}
<section class="panel panel--narrow" aria-label="Log in">
  <h1>Nebula Operation Station</h1>
  <p>Log in with a registered security key or passkey.</p>
  <button type="button" id="login" class="button">Log in with security key</button>
  <p id="message" class="message" role="status" aria-live="polite"></p>
  <p class="hint">No key registered yet? <a href="/setup">Register a security key</a> with a one-time code from the executor host.</p>
</section>
{{end}}
