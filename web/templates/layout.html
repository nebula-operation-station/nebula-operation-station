{{define "layout"}}<!DOCTYPE html>
<html lang="en" data-theme="{{.Theme}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — Nebula Operation Station</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {{if not .Bare}}
  <div class="app{{if .NavCollapsed}} app--nav-collapsed{{end}}">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__head">
        <a class="sidebar__brand" href="/dashboard"{{if .NavCollapsed}} title="Nebula"{{end}}>
          <svg class="sidebar__icon" aria-hidden="true"><use href="/static/icons.svg#i-orbit"></use></svg>
          <span class="sidebar__text">Nebula</span>
        </a>
        <button type="button" class="topbar__menu sidebar__collapse" id="nav-collapse"
          aria-label="{{if .NavCollapsed}}Expand navigation{{else}}Collapse navigation{{end}}"
          aria-expanded="{{if .NavCollapsed}}false{{else}}true{{end}}" aria-controls="sidebar-nav">
          <svg aria-hidden="true"><use href="/static/icons.svg#i-panel-left-{{if .NavCollapsed}}open{{else}}close{{end}}"></use></svg>
        </button>
        <button type="button" class="topbar__menu sidebar__close" id="nav-close" aria-label="Close navigation">
          <svg aria-hidden="true"><use href="/static/icons.svg#i-x"></use></svg>
        </button>
      </div>
      <nav class="sidebar__nav" id="sidebar-nav" aria-label="Main navigation">
        <a class="sidebar__item{{if eq .Active "dashboard"}} sidebar__item--active{{end}}" href="/dashboard"{{if .NavCollapsed}} title="Dashboard"{{end}}{{if eq .Active "dashboard"}} aria-current="page"{{end}}>
          <svg class="sidebar__icon" aria-hidden="true"><use href="/static/icons.svg#i-layout-dashboard"></use></svg>
          <span>Dashboard</span>
        </a>
        <a class="sidebar__item{{if eq .Active "inventory"}} sidebar__item--active{{end}}" href="/inventory"{{if .NavCollapsed}} title="Inventory"{{end}}{{if eq .Active "inventory"}} aria-current="page"{{end}}>
          <svg class="sidebar__icon" aria-hidden="true"><use href="/static/icons.svg#i-server"></use></svg>
          <span>Inventory</span>
        </a>
        <a class="sidebar__item{{if eq .Active "network"}} sidebar__item--active{{end}}" href="/network"{{if .NavCollapsed}} title="Network"{{end}}{{if eq .Active "network"}} aria-current="page"{{end}}>
          <svg class="sidebar__icon" aria-hidden="true"><use href="/static/icons.svg#i-globe"></use></svg>
          <span>Network</span>
        </a>
        <a class="sidebar__item{{if eq .Active "operations"}} sidebar__item--active{{end}}" href="/operations"{{if .NavCollapsed}} title="Operations"{{end}}{{if eq .Active "operations"}} aria-current="page"{{end}}>
          <svg class="sidebar__icon" aria-hidden="true"><use href="/static/icons.svg#i-play"></use></svg>
          <span>Operations</span>
        </a>
        <a class="sidebar__item{{if eq .Active "runbooks"}} sidebar__item--active{{end}}" href="/runbooks"{{if .NavCollapsed}} title="Runbooks / Modules"{{end}}{{if eq .Active "runbooks"}} aria-current="page"{{end}}>
          <svg class="sidebar__icon" aria-hidden="true"><use href="/static/icons.svg#i-book-open"></use></svg>
          <span>Runbooks / Modules</span>
        </a>
        <a class="sidebar__item{{if eq .Active "history"}} sidebar__item--active{{end}}" href="/history"{{if .NavCollapsed}} title="History"{{end}}{{if eq .Active "history"}} aria-current="page"{{end}}>
          <svg class="sidebar__icon" aria-hidden="true"><use href="/static/icons.svg#i-history"></use></svg>
          <span>History</span>
        </a>
        <a class="sidebar__item{{if eq .Active "settings"}} sidebar__item--active{{end}}" href="/settings"{{if .NavCollapsed}} title="Settings"{{end}}{{if eq .Active "settings"}} aria-current="page"{{end}}>
          <svg class="sidebar__icon" aria-hidden="true"><use href="/static/icons.svg#i-settings"></use></svg>
          <span>Settings</span>
        </a>
      </nav>
    </aside>
    <div class="app__body">
      <header class="topbar">
        <button type="button" class="topbar__menu topbar__menu--mobile" id="nav-menu"
          aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
          <svg aria-hidden="true"><use href="/static/icons.svg#i-menu"></use></svg>
        </button>
        <form class="topbar__search nav__search" action="/search" method="get" role="search">
          <svg aria-hidden="true"><use href="/static/icons.svg#i-search"></use></svg>
          <input type="search" name="q" maxlength="100" placeholder="Search hosts, IPs, assets …" aria-label="Search"{{with .Search}} value="{{.Query}}"{{end}}>
        </form>
        <button type="button" class="topbar__logout button button--secondary button--small" id="logout">Log out</button>
      </header>
      <main class="main content">
        {{template "content" .}}
      </main>
    </div>
    <div class="sidebar__backdrop" id="nav-backdrop" aria-hidden="true"></div>
  </div>
  {{else}}
  <main class="main main--bare">
    {{template "content" .}}
  </main>
  {{end}}
  <script src="/static/htmx.min.js"></script>
  <script src="/static/time.js"></script>
  {{if not .Bare}}<script src="/static/nav.js"></script>{{end}}
  {{range .Scripts}}<script src="/static/{{.}}"></script>{{end}}
</body>
</html>
{{end}}
