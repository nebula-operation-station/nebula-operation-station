# SPDX-License-Identifier: AGPL-3.0-or-later
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - run: make fmt-check
      - run: go vet ./...
      - run: make test
      - name: Privileged security tests (multi-UID)
        run: sudo -E env "PATH=$PATH" make test-privileged

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
      - name: staticcheck and buf lint
        run: make lint LINT_TOOLCHAIN=local
      - name: Generated code up to date
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          make generate-check

  vuln:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - run: make vuln

  protected-paths:
    # Tripwire for agent branches. The rules and the checker are taken from
    # the BASE commit, so a PR cannot edit the list it is checked against.
    # The binding protection is branch protection on main with required
    # code-owner review and "dismiss stale approvals on new commits"; the
    # label below only silences this check and must be re-applied after
    # every push by a maintainer.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'protected-change-approved') }}
        run: |
          agent_commits=$(git log --format='%ae' "$BASE_SHA..HEAD" | grep -c '^nos-coder@localhost$' || true)
          if [[ "$HEAD_REF" != agent/* && "$agent_commits" -eq 0 ]]; then
            echo "not an agent change"; exit 0
          fi
          if [[ "$APPROVED" == "true" ]]; then
            echo "protected change approved by label"; exit 0
          fi
          tmp=$(mktemp -d)
          if git cat-file -e "$BASE_SHA:.github/protected-paths.txt" 2>/dev/null; then
            git show "$BASE_SHA:.github/protected-paths.txt" > "$tmp/paths.txt"
            git show "$BASE_SHA:scripts/check-protected-paths.sh" > "$tmp/check.sh"
          else
            echo "::warning::base has no protected-paths list; using the PR's copy"
            cp .github/protected-paths.txt "$tmp/paths.txt"
            cp scripts/check-protected-paths.sh "$tmp/check.sh"
          fi
          git diff --name-only --no-renames "$BASE_SHA...HEAD" | PROTECTED_PATHS_FILE="$tmp/paths.txt" bash "$tmp/check.sh"
